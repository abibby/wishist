services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wishist
      POSTGRES_PASSWORD: wishist
      POSTGRES_DB: wishist
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wishist"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
